<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Smart City Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600&display=swap">
<style>
/* Layout: full-bleed stage; the maquette sits whole inside the frame on a transparent canvas.
   Two small control clusters float in the lower corners and fade when idle; export opens a popover above them.
   Single daytime look by choice, so the chrome stays light in every theme. */
:root{
  --sky-top:#cfe6f7;
  --sky-bot:#f4f8fb;
  --ink:#17324a;
  --ink-2:#4d687e;
  --chip:rgba(250,252,253,.86);
  --line:rgba(23,50,74,.12);
  --data:#0e9fb4;
  --data-soft:rgba(14,159,180,.14);
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:transparent;color:var(--ink);font-family:var(--f-ui)}
#stage{position:fixed;inset:0;background:transparent;transition:background .3s}
#stage[data-bg="white"]{background:#ffffff}
#stage[data-bg="dark"]{background:radial-gradient(120% 90% at 50% 40%,#2a3b4a,#141d26)}
#stage[data-bg="checker"]{background:repeating-conic-gradient(#e6eaee 0 25%,#ffffff 0 50%) 0 0/24px 24px}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;object-fit:contain}
.hud{display:none!important;position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;transition:opacity .45s ease}
.hud.idle,.hud.clean{opacity:0}
.hud.clean *{pointer-events:none!important}
.cap,.tools,.panel,.busy .card{pointer-events:auto;background:var(--chip);border:1px solid var(--line);border-radius:12px;
  -webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 6px 24px rgba(23,50,74,.08)}
.cap{padding:10px 14px 11px;display:grid;gap:6px;min-width:0}
.name{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.meta{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:relative;width:112px;height:3px;border-radius:2px;background:var(--data-soft);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--data);border-radius:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.tools{display:flex;gap:2px;padding:4px}
.tools button{appearance:none;border:0;background:transparent;color:var(--ink);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.tools button:hover{background:rgba(23,50,74,.07)}
.tools button:focus-visible,.seg button:focus-visible,.panel button:focus-visible{outline:2px solid var(--data);outline-offset:1px}
.tools button[aria-pressed="true"]{color:var(--data);background:var(--data-soft)}
.tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;margin:7px 3px;background:var(--line)}
.panel{width:min(340px,calc(100vw - 32px));padding:14px 14px 12px;display:grid;gap:12px}
.ph{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:-.01em}
.field{display:grid;gap:6px}
.field>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:rgba(23,50,74,.06)}
.seg button{flex:1 1 0;min-width:0;appearance:none;border:0;background:transparent;color:var(--ink);font:500 12.5px/1 var(--f-ui);padding:8px 6px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(23,50,74,.14)}
.seg button:disabled{opacity:.38;cursor:not-allowed}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{accent-color:var(--data);width:16px;height:16px;margin:0}
.note{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:500 13px/1 var(--f-ui);padding:9px 14px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(244,248,251,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:16px}
.busy .card{width:min(420px,100%);padding:18px;display:grid;gap:12px}
.pbar{height:6px;border-radius:3px;background:var(--data-soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--data);border-radius:3px;transition:width .2s}
.busy .meta{white-space:normal}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;white-space:nowrap;transition:opacity .3s}
.lab span{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;display:flex;align-items:center;gap:6px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lab span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--data);box-shadow:0 0 0 3px var(--data-soft)}
.lab i{width:1px;height:22px;background:linear-gradient(var(--ink-2),transparent);opacity:.5}
.toast{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:12.5px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .5s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.fade{opacity:0}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-ui);font-size:13px;color:var(--ink-2);letter-spacing:.02em;transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
@media (max-width:560px){.bar{width:64px}.tools button{width:32px;height:32px}.name{font-size:14px}.hud{gap:8px}.cap{padding:8px 11px}}
@media (max-width:440px){#bLabels,#bFull,#bBg{display:none}.sep{display:none}}
@media (prefers-reduced-motion: reduce){.hud,.toast,#loading{transition:none}}
</style>

<div id="stage" data-bg="sky">
  <canvas id="scene" aria-label="Maquete isométrica animada de uma cidade inteligente sustentável, em loop contínuo de 30 segundos" role="img"></canvas>
  <div id="labels" hidden></div>
  <div id="loading">Montando a cidade…</div>
  <div class="hud" id="hud">
    <div class="cap">
      <div class="name">Smart City Loop</div>
      <div class="meta"><span class="bar"><i id="prog"></i></span><span id="clock">00,0 / 30 s</span></div>
    </div>
    <div class="right">
      <div class="panel" id="exPanel" hidden role="dialog" aria-labelledby="exTitle">
        <div class="ph" id="exTitle">Exportar com fundo transparente</div>
        <div class="field"><span>Formato</span>
          <div class="seg" data-name="format" role="group" aria-label="Formato">
            <button type="button" data-v="webm" aria-pressed="true">Vídeo WebM</button>
            <button type="button" data-v="png" aria-pressed="false">Sequência PNG</button>
            <button type="button" data-v="still" aria-pressed="false">Imagem PNG</button>
          </div>
        </div>
        <div class="field"><span>Resolução</span>
          <div class="seg" data-name="res" role="group" aria-label="Resolução">
            <button type="button" data-v="1080" aria-pressed="false">1080p</button>
            <button type="button" data-v="1440" aria-pressed="false">1440p</button>
            <button type="button" data-v="2160" aria-pressed="true">4K</button>
          </div>
        </div>
        <div class="field" id="fpsField"><span>Quadros por segundo</span>
          <div class="seg" data-name="fps" role="group" aria-label="Quadros por segundo">
            <button type="button" data-v="30" aria-pressed="false">30 fps</button>
            <button type="button" data-v="60" aria-pressed="true">60 fps</button>
          </div>
        </div>
        <label class="chk" for="exData"><input type="checkbox" id="exData" checked> Incluir linhas de dados IoT</label>
        <p class="note" id="exNote"></p>
        <div class="actions"><button type="button" class="btn" id="exClose">Fechar</button><button type="button" class="btn primary" id="exGo">Exportar</button></div>
      </div>
      <div class="tools" role="toolbar" aria-label="Reprodução e visualização">
        <button id="bPlay" type="button" aria-label="Pausar" title="Pausar (Espaço)"><svg viewBox="0 0 24 24"><path id="playIcon" d="M9 6v12M15 6v12"/></svg></button>
        <button id="bRestart" type="button" aria-label="Reiniciar o loop" title="Reiniciar o loop (R)"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button id="bData" type="button" aria-pressed="true" aria-label="Camada de dados" title="Camada de dados (D)"><svg viewBox="0 0 24 24"><circle cx="5" cy="17" r="1.8"/><circle cx="19" cy="17" r="1.8"/><circle cx="12" cy="5.5" r="1.8"/><path d="M6.2 15.6C7.5 10 9 7.5 10.6 6.4M17.8 15.6C16.5 10 15 7.5 13.4 6.4"/></svg></button>
        <button id="bLabels" type="button" aria-pressed="false" aria-label="Rótulos" title="Rótulos (L)"><svg viewBox="0 0 24 24"><path d="M4 6.5h11l4 5.5-4 5.5H4z"/></svg></button>
        <button id="bBg" type="button" aria-label="Fundo da visualização: céu" title="Trocar fundo da visualização (B)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 16 20 4M8 20 20 8"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button id="bExport" type="button" aria-expanded="false" aria-controls="exPanel" aria-label="Exportar" title="Exportar vídeo ou imagem transparente (E)"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg></button>
        <button id="bFull" type="button" aria-label="Tela cheia" title="Tela cheia (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button id="bClean" type="button" aria-label="Modo limpo para gravação" title="Modo limpo para gravação (H)"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20 20 4"/></svg></button>
      </div>
    </div>
  </div>
  <div class="busy" id="busy" hidden>
    <div class="card" role="status" aria-live="polite">
      <div class="ph" id="busyTitle">Exportando</div>
      <div class="pbar"><i id="busyBar"></i></div>
      <div class="meta" id="busyMeta">Preparando…</div>
      <div class="actions"><button type="button" class="btn" id="busyCancel">Cancelar</button></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const loadingEl = document.getElementById('loading');
if (!window.THREE){ loadingEl.textContent = 'Não foi possível carregar a biblioteca 3D. Verifique a conexão e recarregue a página.'; return; }

/* =====================================================================
   MASTER CLOCK — every motion is a whole number of cycles per T,
   so frame(t) === frame(t + T) and the loop is seamless.
   ===================================================================== */
const T = 30, TAU = Math.PI * 2;
let seed = 20261008;
function rng(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rng();
const pick = a => a[Math.floor(rng() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- renderer: transparent canvas ---------- */
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: true, powerPreference: 'high-performance' });
} catch (e) { loadingEl.textContent = 'Este dispositivo não conseguiu iniciar o WebGL, necessário para a cena 3D.'; return; }
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const isSmall = Math.min(window.innerWidth, window.innerHeight) < 600;
const scene = new THREE.Scene();

/* ---------- image-based light: soft daytime sky (8-bit cube, works everywhere) ---------- */
const SUN_DIR = new THREE.Vector3(-0.42, 0.80, 0.43).normalize();
(function makeEnv(){
  const s = new THREE.Scene();
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, uniforms: { uSun: { value: SUN_DIR } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform vec3 uSun; varying vec3 vP;
      void main(){ vec3 d = normalize(vP); float h = d.y;
        vec3 sky = mix(vec3(0.92,0.95,0.98), vec3(0.42,0.64,0.92), smoothstep(0.0, 0.75, h));
        vec3 gnd = mix(vec3(0.74,0.76,0.72), vec3(0.52,0.56,0.50), smoothstep(0.0, -0.6, h));
        vec3 c = h > 0.0 ? sky : gnd; float sd = max(dot(d, uSun), 0.0);
        c += vec3(1.0,0.96,0.88) * (pow(sd, 60.0) * 0.6 + pow(sd, 8.0) * 0.25);
        gl_FragColor = vec4(c, 1.0); }`
  });
  s.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), m));
  const rt = new THREE.WebGLCubeRenderTarget(256, { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
  new THREE.CubeCamera(0.1, 100, rt).update(renderer, s);
  scene.environment = rt.texture;
})();

/* ---------- lights ---------- */
const sun = new THREE.DirectionalLight(0xfff3e0, 2.35);
sun.position.copy(SUN_DIR).multiplyScalar(240).add(new THREE.Vector3(-2, 0, -2));
sun.target.position.set(-2, 0, -2);
sun.castShadow = true;
const SH = isSmall ? 2048 : 4096;
sun.shadow.mapSize.set(SH, SH);
Object.assign(sun.shadow.camera, { left: -98, right: 98, top: 98, bottom: -98, near: 80, far: 480 });
sun.shadow.bias = -0.00035; sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xd6e9ff, 0xcfc8b4, 0.4));

/* ---------- camera: true isometric, framed so the whole maquette fits ---------- */
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 1400);
const CAM_TARGET = new THREE.Vector3(-2, 0.5, -2);
camera.position.copy(CAM_TARGET).add(new THREE.Vector3(1, 1, 1).normalize().multiplyScalar(500));
camera.lookAt(CAM_TARGET);
function frameCamera(aspect){
  const Hv = Math.max(124, 202 / aspect);
  camera.left = -Hv * aspect / 2; camera.right = Hv * aspect / 2; camera.top = Hv / 2; camera.bottom = -Hv / 2;
  camera.updateProjectionMatrix();
}

/* =====================================================================
   GEOMETRY BUILDER — static parts are merged by material (~25 draw calls)
   ===================================================================== */
const B = {};
const newBucket = () => ({ p: [], n: [], u: [], c: [] });
const bk = k => (typeof k === 'string') ? (B[k] || (B[k] = newBucket())) : k;
const colCache = new Map();
function lin(hex){ let c = colCache.get(hex); if (!c){ c = new THREE.Color(hex).convertSRGBToLinear(); colCache.set(hex, c); } return c; }
const UP = new THREE.Vector3(0, 1, 0);
const _e = new THREE.Euler(), _q = new THREE.Quaternion(), _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
function M(x, y, z, ry = 0, sx = 1, sy = 1, sz = 1, rx = 0, rz = 0){
  _e.set(rx, ry, rz, 'YXZ'); _q.setFromEuler(_e);
  return new THREE.Matrix4().compose(_v1.set(x, y, z), _q, _v2.set(sx, sy, sz));
}
const _nm = new THREE.Matrix3(), _pp = new THREE.Vector3(), _np = new THREE.Vector3();
function pushGeo(key, g, color, m){
  const b = bk(key);
  const P = g.attributes.position.array, N = g.attributes.normal.array, U = g.attributes.uv ? g.attributes.uv.array : null;
  const cnt = g.attributes.position.count;
  const fn = typeof color === 'function';
  const own = color === null ? g.attributes.color.array : null;
  const c0 = (fn || own) ? null : lin(color);
  if (m) _nm.getNormalMatrix(m);
  for (let i = 0; i < cnt; i++){
    _pp.set(P[i*3], P[i*3+1], P[i*3+2]);
    const c = own ? { r: own[i*3], g: own[i*3+1], b: own[i*3+2] } : fn ? lin(color(_pp.x, _pp.y, _pp.z, N[i*3], N[i*3+1], N[i*3+2])) : c0;
    if (m) _pp.applyMatrix4(m);
    _np.set(N[i*3], N[i*3+1], N[i*3+2]); if (m) _np.applyMatrix3(_nm).normalize();
    b.p.push(_pp.x, _pp.y, _pp.z); b.n.push(_np.x, _np.y, _np.z);
    if (U) b.u.push(U[i*2], U[i*2+1]); else b.u.push(0, 0);
    b.c.push(c.r, c.g, c.b);
  }
}
const _ab = new THREE.Vector3(), _ac = new THREE.Vector3(), _tn = new THREE.Vector3();
function tri(key, a, b2, c, color, ua, ub, uc, expN){
  const b = bk(key);
  _ab.subVectors(b2, a); _ac.subVectors(c, a); _tn.crossVectors(_ab, _ac);
  if (expN && _tn.dot(expN) < 0){ const t = b2; b2 = c; c = t; const tu = ub; ub = uc; uc = tu; _tn.negate(); }
  _tn.normalize();
  const col = lin(color), pts = [a, b2, c], uvs = [ua, ub, uc];
  for (let i = 0; i < 3; i++){ const p = pts[i], u = uvs[i]; b.p.push(p.x, p.y, p.z); b.n.push(_tn.x, _tn.y, _tn.z); b.u.push(u ? u[0] : 0, u ? u[1] : 0); b.c.push(col.r, col.g, col.b); }
}
function quad(key, p0, p1, p2, p3, color, uvs, expN){
  tri(key, p0, p1, p2, color, uvs && uvs[0], uvs && uvs[1], uvs && uvs[2], expN);
  tri(key, p0, p2, p3, color, uvs && uvs[0], uvs && uvs[2], uvs && uvs[3], expN);
}
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
function rect(key, x0, z0, x1, z1, y, color, uvS = 0){
  const uv = uvS ? [[x0/uvS, -z0/uvS], [x1/uvS, -z0/uvS], [x1/uvS, -z1/uvS], [x0/uvS, -z1/uvS]] : null;
  quad(key, V3(x0, y, z0), V3(x1, y, z0), V3(x1, y, z1), V3(x0, y, z1), color, uv, UP);
}
function disc(key, cx, cz, rx, rz, y, color, uvS, seg = 40){
  for (let i = 0; i < seg; i++){
    const a0 = i / seg * TAU, a1 = (i + 1) / seg * TAU;
    const p0 = V3(cx, y, cz), p1 = V3(cx + Math.cos(a0) * rx, y, cz + Math.sin(a0) * rz), p2 = V3(cx + Math.cos(a1) * rx, y, cz + Math.sin(a1) * rz);
    const u = p => [p.x / uvS, -p.z / uvS];
    tri(key, p0, p1, p2, color, u(p0), u(p1), u(p2), UP);
  }
}
const GEO = {};
function ugeo(name, make){ return GEO[name] || (GEO[name] = (g => g.index ? g.toNonIndexed() : g)(make())); }
const UBOX = () => ugeo('box', () => new THREE.BoxGeometry(1, 1, 1));
function box(key, x, y, z, w, h, d, color, ry = 0){ pushGeo(key, UBOX(), color, M(x, y + h/2, z, ry, w, h, d)); }
function boxC(key, x, y, z, w, h, d, color, ry = 0, rx = 0, rz = 0){ pushGeo(key, UBOX(), color, M(x, y, z, ry, w, h, d, rx, rz)); }
function cyl(key, x, y, z, rT, rB, h, color, seg = 12, open = false){
  const ratio = Math.round(rT / rB * 100) / 100;

function mkCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* path with true circular corner arcs, arc-length parameterised */
class Path {
  constructor(pts, closed){
    this.pts = pts; this.closed = closed; const n = pts.length;
    this.cum = new Float64Array(n + 1); let L = 0;
    for (let i = 1; i < n; i++){ L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); this.cum[i] = L; }
    if (closed) L += Math.hypot(pts[0][0] - pts[n-1][0], pts[0][1] - pts[n-1][1]);
    this.cum[n] = L; this.L = L;
  }
  at(s, out){
    const L = this.L; s = ((s % L) + L) % L;
    const c = this.cum, n = this.pts.length; let lo = 0, hi = this.closed ? n : n - 1;
    while (hi - lo > 1){ const m = (lo + hi) >> 1; if (c[m] <= s) lo = m; else hi = m; }
    const a = this.pts[lo], b = this.pts[(lo + 1) % n], seg = (c[lo + 1] - c[lo]) || 1, t = (s - c[lo]) / seg;
    out[0] = a[0] + (b[0] - a[0]) * t; out[1] = a[1] + (b[1] - a[1]) * t; return out;
  }
  distTo(x, z){ let m = 1e9; for (let i = 0; i < this.pts.length; i += 2){ const p = this.pts[i]; const d = (p[0] - x) ** 2 + (p[1] - z) ** 2; if (d < m) m = d; } return Math.sqrt(m); }

function roundedPath(corners, closed, radiusFn, step = 0.5){
  const n = corners.length, pts = [], arcAt = {};
  const idx = closed ? [...Array(n).keys()] : [...Array(n - 2).keys()].map(i => i + 1);
  for (const i of idx){
    const a = corners[(i - 1 + n) % n], b = corners[i], c = corners[(i + 1) % n];
    let d1x = b[0] - a[0], d1z = b[1] - a[1]; const l1 = Math.hypot(d1x, d1z); d1x /= l1; d1z /= l1;
    let d2x = c[0] - b[0], d2z = c[1] - b[1]; const l2 = Math.hypot(d2x, d2z); d2x /= l2; d2z /= l2;
    const cross = d1x * d2z - d1z * d2x, phi = Math.acos(clamp(d1x * d2x + d1z * d2z, -1, 1));
    if (phi < 1e-3){ arcAt[i] = null; continue; }
    const r = radiusFn(cross > 0, i), t = r * Math.tan(phi / 2);
    const p1 = [b[0] - d1x * t, b[1] - d1z * t], p2 = [b[0] + d2x * t, b[1] + d2z * t];
    const sgn = cross > 0 ? 1 : -1;
    arcAt[i] = { p1, p2, cc: [p1[0] - d1z * r * sgn, p1[1] + d1x * r * sgn], r };
  }
  const line = (a, b) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.max(1, Math.ceil(L / step)); for (let j = 0; j < k; j++){ const t = j / k; pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); } };
  const arc = A => {
    const a0 = Math.atan2(A.p1[1] - A.cc[1], A.p1[0] - A.cc[0]); let da = Math.atan2(A.p2[1] - A.cc[1], A.p2[0] - A.cc[0]) - a0;
    while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    const k = Math.max(4, Math.ceil(Math.abs(da) * A.r / (step * 0.6)));
    for (let j = 0; j < k; j++){ const a = a0 + da * j / k; pts.push([A.cc[0] + Math.cos(a) * A.r, A.cc[1] + Math.sin(a) * A.r]); }
  };
  if (closed){
    let cur = arcAt[0] ? arcAt[0].p2 : corners[0];
    for (let s = 1; s <= n; s++){ const i = s % n, A = arcAt[i]; line(cur, A ? A.p1 : corners[i]); if (A){ arc(A); cur = A.p2; } else cur = corners[i]; }
  } else {
    let cur = corners[0];
    for (let i = 1; i < n - 1; i++){ const A = arcAt[i]; line(cur, A ? A.p1 : corners[i]); if (A){ arc(A); cur = A.p2; } else cur = corners[i]; }
    line(cur, corners[n - 1]); pts.push(corners[n - 1].slice());
  }
  return new Path(pts, closed);
}

/* ---------- base plate: rounded slab, white sides, asphalt top ---------- */
function rrPath(x0, z0, x1, z1, r, PathClass){
  const p = new PathClass(), X0 = x0, X1 = x1, Y0 = -z1, Y1 = -z0; // shape space: (x, -z)
  p.moveTo(X0 + r, Y0); p.lineTo(X1 - r, Y0); p.absarc(X1 - r, Y0 + r, r, -Math.PI / 2, 0, false);
  p.lineTo(X1, Y1 - r); p.absarc(X1 - r, Y1 - r, r, 0, Math.PI / 2, false);
  p.lineTo(X0 + r, Y1); p.absarc(X0 + r, Y1 - r, r, Math.PI / 2, Math.PI, false);
  p.lineTo(X0, Y0 + r); p.absarc(X0 + r, Y0 + r, r, Math.PI, Math.PI * 1.5, false);
  return p;
}

  stats: () => ({ ...renderer.info.render, cars: TRAFFIC.cars.length, people: PEOPLE.list.length })
};
update(0);
renderer.compile(scene, camera);
loadingEl.classList.add('done');
postAnchors(); setTimeout(postAnchors, 400);
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
